{% load static %}
<!DOCTYPE html>
<html>
<head>
    <link rel="icon" href="{% static 'images/logo.png' %}">
    <title>Boga (Meeting) Assistant</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- HTMX -->
    <!--  <script src="https://unpkg.com/htmx.org@2.0.3"></script>  -->
    <script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.js"></script>

    <style>
        :root {
            --boga-red: #b42318;
            --boga-red-dark: #8f1c14;
            --boga-red-soft: #fef1f0;
            --boga-red-border: #f4c7c3;
        }

        .sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
            border-right: 1px solid #dee2e6;
        }
        .sidebar .nav-link {
            color: #333;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }
        .sidebar .nav-link:hover {
            background-color: #e9ecef;
        }
        .sidebar .nav-link.active {
            background-color: #0d6efd;
            color: white;
        }

        .auth-shell {
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.2), transparent 35%),
                linear-gradient(160deg, #65120e 0%, var(--boga-red) 48%, #de4a3f 100%);
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 1.25rem 3rem rgba(57, 11, 8, 0.28);
            backdrop-filter: blur(10px);
        }

        .auth-card .btn-primary {
            background-color: var(--boga-red);
            border-color: var(--boga-red);
        }

        .auth-card .btn-primary:hover,
        .auth-card .btn-primary:focus,
        .auth-card .btn-primary:active {
            background-color: var(--boga-red-dark);
            border-color: var(--boga-red-dark);
        }

        .auth-card .form-control:focus {
            border-color: #d96b63;
            box-shadow: 0 0 0 0.25rem rgba(180, 35, 24, 0.18);
        }

        .auth-link,
        .auth-card .text-primary {
            color: var(--boga-red) !important;
        }

        .auth-title {
            color: #4a1511;
        }

        .auth-link-row {
            text-align: right;
        }

        .auth-subtle-link {
            color: #7f1d18;
            font-size: 0.8rem;
            text-decoration: none;
            opacity: 0.82;
        }

        .auth-subtle-link:hover,
        .auth-subtle-link:focus {
            color: var(--boga-red);
            opacity: 1;
            text-decoration: underline;
        }

        .auth-whisper {
            color: rgba(74, 21, 17, 0.62);
            font-size: 0.74rem;
            line-height: 1.2;
        }

        .auth-whisper .auth-subtle-link {
            font-size: 0.74rem;
            opacity: 0.68;
        }
    </style>
</head>
<body>
    {% if messages %}
        {% if 'accounts' in request.path or '/projects/' in request.path %}
    <div class="messages position-fixed top-0 start-0 w-100" style="z-index: 1050;">
        {% for message in messages %}
            {% if forloop.last %}
            <div class="alert alert-{{ message.tags }} django-message alert-dismissible fade show m-0 border-0 rounded-0" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endif %}
        {% endfor %}
    </div>
        {% endif %}
    {% endif %}
    {% block body_content %}
    {% endblock %}
    <script>
        // Auto-dismiss alerts after 3 seconds
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                var alerts = document.querySelectorAll('.django-message');
                alerts.forEach(function(alert) {
                    var bsAlert = new bootstrap.Alert(alert);
                    bsAlert.close();
                });
            }, 3000);
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
