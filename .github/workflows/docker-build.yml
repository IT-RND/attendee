name: Docker build

on:
  pull_request:
    branches: [prod-boga]
  push:
    branches: [prod-boga]

permissions:
  contents: read

jobs:
  docker:
    name: Build image
    runs-on: ubuntu-latest
    concurrency:
      group: docker-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: attendee:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-prod:
    name: Deploy production
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod-boga'
    uses: ./.github/workflows/deploy-prod.yml
    secrets: inherit
